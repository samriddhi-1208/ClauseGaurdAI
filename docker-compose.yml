version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: clauseguard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    container_name: clauseguard-ai-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./ai-service:/app

  server:
    build: ./server
    container_name: clauseguard-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/clauseguard
      - JWT_SECRET=clauseguard_legaltech_jwt_secret_key_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - ai-service

  client:
    build: ./client
    container_name: clauseguard-client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
